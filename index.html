<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPUS PLAYER</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin-bottom: 0;
            color: #cbd5e1;
        }

        main {
            max-width: 850px;
            margin: 25px auto;
            padding: 20px;
        }

        .formulario {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000012;
        }

        iframe {
            width: 100%;
            height: 1400px;
            border: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>CAMPUS PLAYER</h1>
    <p>Registro de participantes - Feria de Juegos</p>
</header>

<main>
    <div class="formulario">
        <h2>Registro de participantes</h2>

        <iframe
            src="https://docs.google.com/forms/d/e/1FAIpQLScud-7l5UugiIUKc49Z7uI9xHYqtepRY_kPrj4K6ikH_eZMnw/viewform?embedded=true"
            loading="lazy">
            Cargando formulario...
        </iframe>
    </div>
</main>

<footer>
    CAMPUS PLAYER - Feria de Juegos
</footer>

</body>
</html>
